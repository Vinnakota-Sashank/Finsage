services:
  - type: web
    name: finsage-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOW_DEMO_FALLBACK
        value: "true"
      - key: AUTO_SEED_DEMO_DATA
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./finsage.db
      - key: GEMINI_API_KEY
        sync: false
